<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Designer</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <style>
        .workspace { display: flex; gap: 16px; align-items: flex-start; }
        .palette { width: 150px; flex-shrink: 0; }
        .palette .p-item { margin-bottom: 8px; text-align: center; cursor: pointer; }
        .palette img { width: 100px; height: 100px; object-fit: contain;
                       background: #fafafa; border: 1px solid #eee; border-radius: 6px; }
        .stage-wrap { flex: 1; }
        .toolbar { margin-bottom: 10px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .toolbar small { color: #777; }
        .stage {
            position: relative;
            width: 100%;
            height: 640px;
            background: #fff;
            border: 2px dashed #bbb;
            border-radius: 8px;
            overflow: hidden;
        }
        .stage.over { border-color: #222; background: #f3f3f3; }
        .stage.dark { background: #333; }
        .hint { position: absolute; inset: 0; display: flex; align-items: center;
                justify-content: center; color: #999; pointer-events: none; text-align: center; }
        .layer { position: absolute; cursor: move; user-select: none; touch-action: none; }
        .layer img { width: 100%; height: auto; display: block; pointer-events: none; }
        .layer.selected { outline: 2px solid #2b7cff; }
        .handle { display: none; position: absolute; right: -7px; bottom: -7px; width: 14px; height: 14px;
                  background: #2b7cff; border: 2px solid white; border-radius: 50%; cursor: nwse-resize; }
        .layer.selected .handle { display: block; }
    </style>
</head>
<body>
<div class="app">

    <aside th:replace="~{fragments/layout :: sidebar('designer')}"></aside>

    <main class="content">
        <header class="topbar">
            <h1>Designer</h1>
        </header>

        <div class="workspace">

            <div class="card palette">
                <p style="margin-top:0"><strong>Library</strong></p>
                <div th:each="f : ${files}" class="p-item" th:attr="data-src=@{'/svg/' + ${f}}">
                    <img th:src="@{'/svg/' + ${f}}" draggable="false" alt="SVG">
                </div>
                <small th:if="${#lists.isEmpty(files)}">No files yet.</small>
            </div>

            <div class="stage-wrap">
                <div class="toolbar">
                    <button class="btn btn-light" id="front" type="button">Bring to front</button>
                    <button class="btn btn-light" id="back" type="button">Send to back</button>
                    <button class="btn btn-light" id="del" type="button">Delete layer</button>
                    <button class="btn btn-light" id="bg" type="button">Background</button>
                    <button class="btn btn-light" id="clear" type="button">Clear all</button>
                    <small>Drop .svg files from a folder onto the stage. Drag to move, corner dot or wheel to resize.</small>
                </div>

                <div id="stage" class="stage">
                    <div id="hint" class="hint">Drop an SVG here (for example the tombstone outline),<br>then drop another on top (for example a cross)</div>
                </div>
            </div>
        </div>
    </main>

</div>

<script>
    const stage = document.getElementById('stage');
    const hint = document.getElementById('hint');
    let selected = null;
    let z = 1;

    // stop the browser opening files dropped outside the stage
    ['dragover', 'drop'].forEach(ev => window.addEventListener(ev, e => e.preventDefault()));

    function select(layer) {
        if (selected) selected.classList.remove('selected');
        selected = layer;
        if (selected) selected.classList.add('selected');
    }

    function addLayer(src, x, y) {
        hint.style.display = 'none';
        const layer = document.createElement('div');
        layer.className = 'layer';
        layer.style.width = '220px';
        layer.style.left = Math.max(0, x - 110) + 'px';
        layer.style.top = Math.max(0, y - 110) + 'px';
        layer.style.zIndex = z++;

        const img = document.createElement('img');
        img.src = src;
        img.draggable = false;
        const handle = document.createElement('div');
        handle.className = 'handle';
        layer.append(img, handle);
        stage.appendChild(layer);
        select(layer);

        // move
        layer.addEventListener('pointerdown', e => {
            if (e.target === handle) return;
            select(layer);
            const startX = e.clientX, startY = e.clientY;
            const origX = layer.offsetLeft, origY = layer.offsetTop;
            layer.setPointerCapture(e.pointerId);
            const move = ev => {
                layer.style.left = (origX + ev.clientX - startX) + 'px';
                layer.style.top = (origY + ev.clientY - startY) + 'px';
            };
            const up = () => {
                layer.removeEventListener('pointermove', move);
                layer.removeEventListener('pointerup', up);
            };
            layer.addEventListener('pointermove', move);
            layer.addEventListener('pointerup', up);
        });

        // resize with the corner dot (keeps proportions)
        handle.addEventListener('pointerdown', e => {
            e.stopPropagation();
            select(layer);
            const startX = e.clientX, startW = layer.offsetWidth;
            handle.setPointerCapture(e.pointerId);
            const move = ev => {
                layer.style.width = Math.max(30, startW + ev.clientX - startX) + 'px';
            };
            const up = () => {
                handle.removeEventListener('pointermove', move);
                handle.removeEventListener('pointerup', up);
            };
            handle.addEventListener('pointermove', move);
            handle.addEventListener('pointerup', up);
        });

        // resize with the mouse wheel
        layer.addEventListener('wheel', e => {
            e.preventDefault();
            const w = layer.offsetWidth * (e.deltaY < 0 ? 1.08 : 0.92);
            layer.style.width = Math.max(30, w) + 'px';
        }, { passive: false });
    }

    // drop files from Windows Explorer
    stage.addEventListener('dragenter', e => { e.preventDefault(); stage.classList.add('over'); });
    stage.addEventListener('dragover', e => { e.preventDefault(); stage.classList.add('over'); });
    stage.addEventListener('dragleave', e => { e.preventDefault(); stage.classList.remove('over'); });
    stage.addEventListener('drop', e => {
        e.preventDefault();
        stage.classList.remove('over');
        const files = Array.from(e.dataTransfer.files || []);
        if (files.length === 0) {
            alert('No file received. Drag the .svg from a folder in Windows Explorer.');
            return;
        }
        const rect = stage.getBoundingClientRect();
        files.forEach((f, i) => {
            if (!f.name.toLowerCase().endsWith('.svg')) { alert(f.name + ' is not an .svg file'); return; }
            addLayer(URL.createObjectURL(f), e.clientX - rect.left + i * 20, e.clientY - rect.top + i * 20);
        });
    });

    // click a library thumbnail to add it
    document.querySelectorAll('.p-item').forEach(p =>
        p.addEventListener('click', () => addLayer(p.dataset.src, 200, 200)));

    // click empty stage = deselect
    stage.addEventListener('pointerdown', e => { if (e.target === stage) select(null); });

    // toolbar
    document.getElementById('front').onclick = () => { if (selected) selected.style.zIndex = z++; };
    document.getElementById('back').onclick = () => { if (selected) selected.style.zIndex = 0; };
    document.getElementById('del').onclick = () => { if (selected) { selected.remove(); selected = null; } };
    document.getElementById('bg').onclick = () => stage.classList.toggle('dark');
    document.getElementById('clear').onclick = () => {
        stage.querySelectorAll('.layer').forEach(l => l.remove());
        selected = null;
        hint.style.display = 'flex';
    };
    window.addEventListener('keydown', e => {
        if (e.key === 'Delete' && selected) { selected.remove(); selected = null; }
    });
</script>
</body>
</html>
