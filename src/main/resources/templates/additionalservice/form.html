
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${additionalservice.id != null} ? 'Edit Service' : 'Add Service'">
        Additional Service
    </title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<div class="app">

    <aside th:replace="~{fragments/layout :: sidebar('additional-services')}"></aside>

    <main class="content">
        <header class="topbar">
            <h1 th:text="${additionalservice.id != null} ? 'Edit Service' : 'Add Service'"></h1>
        </header>

        <div class="card" style="padding: 20px;">
            <form th:action="${additionalservice.id != null}
    ? @{/additionalservices/{id}(id=${additionalservice.id})}
    : @{/additionalservices}"
                  th:object="${additionalservice}"
                  method="post">

                <p>
                    <label>Name</label><br>
                    <input type="text" th:field="*{name}" required>
                </p>

                <p>
                    <label>Price</label><br>
                    <input type="number" step="0.01" min="0"
                           th:field="*{price}" required>
                </p>

                <p>
                    <label>Description</label><br>
                    <textarea th:field="*{description}" rows="4"></textarea>
                </p>

                <button class="btn" type="submit">Save</button>
                <a class="btn btn-light" th:href="@{/additionalservices}">Cancel</a>
            </form>
        </div>
    </main>

</div>
</body>
</html>
