
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Clients</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<div class="app">

    <aside th:replace="~{fragments/layout :: sidebar('clients')}"></aside>

    <main class="content">
        <header class="topbar">
            <h1 class="title-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="8" r="3.5"/>
                    <path d="M5 20c0-3.9 3.1-6 7-6s7 2.1 7 6"/>
                </svg>
                Clients
            </h1>
        </header>
        <form class="filters" method="get" th:action="@{/clients}">
            <div>
                <label>Client name</label>
                <input type="text" name="name" placeholder="Search ..." th:value="${fName}">
            </div>

            <div class="filter-actions">
                <button class="btn" type="submit">Filter</button>
                <a class="btn btn-light" th:href="@{/clients}">Clear</a>
            </div>
        </form>
        <div class="card">
            <table>
                <thead>
                <tr>
                    <th>Client #</th>
                    <th>Name</th>
                    <th>Phone Number</th>
                    <th>Total Orders</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="c : ${clients}">
                    <td th:text="${c.Id}"></td>
                    <td th:text="${c.Name}"></td>
                    <td th:text="${c.PhoneNumber}"></td>
                    <td th:text="${c.orders != null ? c.orders.size() : 0}"></td>
                </tr>

                <tr th:if="${#lists.isEmpty(clients)}">
                    <td colspan="4" style="text-align: center;">
                        No clients registered yet.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>

</div>
</body>
</html>
