<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${ornament.id != null} ? 'Edit Ornament' : 'Add Ornament'">Ornament</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<div class="app">

    <aside th:replace="~{fragments/layout :: sidebar('ornaments')}"></aside>

    <main class="content">
        <header class="topbar">
            <h1 th:text="${ornament.id != null} ? 'Edit Ornament' : 'Add Ornament'"></h1>
        </header>

        <div class="card" style="padding: 20px;">
            <form th:action="${ornament.id != null} ? @{/ornaments/{id}(id=${ornament.id})} : @{/ornaments}"
                  th:object="${ornament}" method="post" enctype="multipart/form-data">
                <p>
                    <label>Catalogue #</label><br>
                    <input type="number" th:field="*{catalogueNum}">
                </p>
                <p>
                    <label>Name</label><br>
                    <input type="text" th:field="*{name}">
                </p>
                <p>
                    <label>Price</label><br>
                    <input type="number" step="0.01" th:field="*{price}" required>
                </p>
                <p>
                    <label>Photo (JPEG)</label><br>
                    <img th:if="${ornament.ornamentImageFileName != null}"
                         th:src="@{'/uploads/' + ${ornament.ornamentImageFileName}}" width="100"><br>
                    <input type="file" name="image" accept="image/jpeg">
                    <small th:if="${ornament.id != null}">Leave empty to keep the current photo.</small>
                </p>
                <button class="btn" type="submit">Save</button>
                <a class="btn btn-light" th:href="@{/ornaments}">Cancel</a>
            </form>
        </div>
    </main>

</div>
</body>
</html>
