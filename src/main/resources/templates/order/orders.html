
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Orders | Memorial Ledger</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<div class="app">

    <aside th:replace="~{fragments/layout :: sidebar('orders')}"></aside>

    <main class="content">

        <header class="topbar">
            <div>
                <h1 class="title-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M7 3h7l4 4v14H7z"/>
                        <path d="M14 3v4h4"/>
                        <path d="M10 12h5M10 15.5h5"/>
                    </svg>
                    Orders
                </h1>
                <p style="color: #777; margin-top: 5px;">
                    Manage memorial orders and track their progress.
                </p>
            </div>

            <a class="btn" th:href="@{/orders/new}">
                + Add Order
            </a>
        </header>

        <div class="card" style="padding: 20px;">

            <div style="display: flex; justify-content: space-between;
                        align-items: center; margin-bottom: 20px;">
                <h2 style="margin: 0;">All Orders</h2>
                <span style="color: #777;"
                      th:text="${#lists.size(orders)} + ' orders'">
                    0 orders
                </span>
            </div>
            <form class="filters" method="get" th:action="@{/orders}">
                <div>
                    <label>Label</label>
                    <select name="status">
                        <option value="">All</option>
                        <option th:each="s : ${statuses}"
                                th:value="${s}"
                                th:text="${s.displayName}"
                                th:selected="${fStatus == s}"></option>
                    </select>
                </div>

                <div>
                    <label>From</label>
                    <input type="date" name="from"
                            th:value="${fFrom != null} ? ${#dates.format(fFrom, 'yyyy-MM-dd')} : ''">
                </div>
                <div>
                    <label>To</label>
                    <input type="date" name="to"
                           th:value="${fTo != null} ? ${#dates.format(fTo, 'yyyy-MM-dd')} : ''">
                </div>
                <div>
                    <label>Cemetery</label>
                    <input type="text" name="cemetery" placeholder="Search ..." th:value="${Cemetery}">
                </div>
                <div class="filter-actions">
                    <button class="btn" type="submit">Filter</button>
                    <a class="btn btn-light" th:href="@{/orders}">Clear</a>
                </div>
            </form>
            <p class="muted" th:text="${#lists.size(orders)} + ' order(s) found'"></p>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Client</th>
                        <th>Deceased</th>
                        <th>Cemetery</th>
                        <th>Order Date</th>
                        <th>Deadline</th>
                        <th>Status</th>
                        <th>Total Price</th>
                        <th>Actions</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="o : ${orders}">
                        <td>
                            <span style="font-size: 12px; color: #777;"
                                  th:text="${#strings.substring(o.Id.toString(), 0, 8)}">
                            </span>
                        </td>

                        <td th:text="${o.client != null ? o.client.name : 'Unassigned'}">
                            Client
                        </td>

                        <td>
                            <span th:each="name, iter : ${o.Deceased}">
                                <span th:text="${name}"></span>
                                <span th:if="${!iter.last}">, </span>
                            </span>
                        </td>

                        <td th:text="${o.Cemetery}">Cemetery</td>

                        <td th:text="${o.DateOfOrder != null ? #dates.format(o.DateOfOrder, 'dd MMM yyyy') : '-'}">
                        </td>

                        <td th:text="${o.Deadline != null ? #dates.format(o.Deadline, 'dd MMM yyyy') : '-'}">
                        </td>

                        <td>
                            <span class="badge"
                                  th:text="${o.status}"
                                  th:classappend="${o.status != null and o.status.toString() == 'COMPLETED'} ? ' badge-success' :
                                                   (${o.status != null and o.status.toString() == 'PENDING'} ? ' badge-warning' : ' badge-neutral')">
                            </span>
                        </td>

                        <td>
                            <strong th:text="${o.TotalPrice != null ? #numbers.formatDecimal(o.TotalPrice, 1, 2) + ' €  ' : '-'}">
                            </strong>
                        </td>

                        <td>
                            <a class="btn btn-light"
                               th:href="@{/orders/{id}/edit(id=${o.Id})}">
                                Edit
                            </a>
                            <a class="btn btn-light" th:href="@{/orders/{id}/preview(id=${o.id})}">Preview</a>
                            <form th:action="@{/orders/{id}/delete(id=${o.Id})}" method="post"
                                  style="display:inline"
                                  onsubmit="return confirm('Delete this order?');">
                                <button class="btn" type="submit">Delete</button>
                            </form>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(orders)}">
                        <td colspan="9" style="text-align: center; padding: 40px; color: #888;">
                            No orders yet. Click "+ Add Order" to create your first order.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>

    </main>
</div>
</body>
</html>
